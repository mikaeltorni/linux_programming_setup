name: Local Continue
version: 1.0.0
schema: v1

models:
  - name: VibeThinker 1.5B LM Studio
    provider: openai
    apiBase: http://localhost:1234/v1
    model: vibethinker-1.5b
    roles:
      - autocomplete
    autocompleteOptions:
      disableInFiles:
        - "*.md"
        - "*.txt"
    defaultCompletionOptions:
      contextLength: 8192
      temperature: 0.2

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal

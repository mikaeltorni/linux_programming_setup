name: Local Continue
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5 Coder 1.5B LM Studio
    provider: openai
    apiBase: http://localhost:1234/v1
    model: qwen2.5-coder-1.5b-instruct
    roles:
      - autocomplete
    autocompleteOptions:
      disableInFiles:
        - "*.md"
        - "*.txt"
    defaultCompletionOptions:
      contextLength: 32768
      temperature: 0.2

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
